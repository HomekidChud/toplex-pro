name: Build & Release (macOS, Windows, Linux, Android)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - name: Build DMG (Apple Silicon)
        run: npx electron-builder --mac dmg --arm64 --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - run: codesign --force --deep --sign - "dist/mac-arm64/Toplix Pro.app" || true
      - name: Build DMG (Intel)
        run: npx electron-builder --mac dmg --x64 --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - run: codesign --force --deep --sign - "dist/mac-x64/Toplix Pro.app" || true
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: dist/*.dmg, if-no-files-found: error }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - run: npx electron-builder --win nsis --x64 --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/*.exe, if-no-files-found: error }
      # update metadata the in-app auto-updater reads (latest.yml)
      - uses: actions/upload-artifact@v4
        with: { name: windows-updater, path: dist/latest*.yml, if-no-files-found: warn }

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - run: npx electron-builder --linux AppImage deb --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
      # update metadata the in-app auto-updater reads (latest-linux.yml)
      - uses: actions/upload-artifact@v4
        with: { name: linux-updater, path: dist/latest-linux*.yml, if-no-files-found: warn }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }

      - name: Install Capacitor
        working-directory: mobile
        run: npm install

      - name: Copy web app into the Android shell
        run: |
          rm -rf mobile/www && mkdir -p mobile/www
          cp -r renderer/. mobile/www/

      - name: Create Android project
        working-directory: mobile
        run: |
          npx cap add android
          npx capacitor-assets generate --android --assetBaseDir assets || echo "icon generation skipped"

      - name: Configure Android project (version, toplex:// deep link)
        working-directory: mobile
        run: |
          VERSION=$(node -p "require('../package.json').version")
          CODE=$(node -e "const [a,b,c]=require('../package.json').version.split('.').map(Number);console.log(a*10000+b*100+c)")
          sed -i "s/versionCode 1/versionCode $CODE/; s/versionName \"1.0\"/versionName \"$VERSION\"/" android/app/build.gradle
          python3 ../.github/add-deeplink.py android/app/src/main/AndroidManifest.xml
          cp native/ToplixNativePlugin.java native/ToplixLocalLLMPlugin.java native/MainActivity.java android/app/src/main/java/com/homekidchud/toplexpro/
          # HTTP client used for the ChatGPT sign-in calls (with DNS fallback)
          sed -i '0,/^dependencies {/s//dependencies {\n    implementation "com.squareup.okhttp3:okhttp:4.12.0"\n    implementation "com.google.mediapipe:tasks-genai:0.10.27"/' android/app/build.gradle
          # on-device models only ship 64-bit ARM native libraries (keeps the APK small)
          sed -i '0,/defaultConfig {/s//defaultConfig {\n        ndk { abiFilters "arm64-v8a" }/' android/app/build.gradle

      - name: Sync web assets
        working-directory: mobile
        run: npx cap sync android

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease -x lintVitalRelease --no-daemon

      - name: Sign APK with the permanent key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "$KS_B64" | base64 -d > /tmp/release.p12
          UNSIGNED=$(ls mobile/android/app/build/outputs/apk/release/*.apk | head -1)
          $BT/zipalign -p -f 4 "$UNSIGNED" /tmp/aligned.apk
          mkdir -p out
          $BT/apksigner sign --ks /tmp/release.p12 --ks-type pkcs12 --ks-key-alias toplix \
            --ks-pass env:KS_PASS --out "out/Toplix-Pro-${VERSION}-android.apk" /tmp/aligned.apk
          $BT/apksigner verify --print-certs "out/Toplix-Pro-${VERSION}-android.apk" | head -3
          rm -f /tmp/release.p12

      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/*.apk, if-no-files-found: error }

  # iOS is NOT built from tags — run the "iOS build" workflow manually from the
  # Actions tab when you want a sideloadable .ipa.
  release:
    needs: [macos, windows, linux, android]
    if: ${{ !cancelled() && needs.macos.result == 'success' && needs.windows.result == 'success' && needs.linux.result == 'success' && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          sed "s/__VERSION__/${VERSION}/g" .github/release-notes.md > notes.md
          ls -la artifacts
          gh release create "$TAG" artifacts/* --title "Toplix Pro ${VERSION}" --notes-file notes.md \
            || { gh release upload "$TAG" artifacts/* --clobber && gh release edit "$TAG" --title "Toplix Pro ${VERSION}" --notes-file notes.md; }
