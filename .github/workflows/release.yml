name: Build & Release (macOS, Windows, Linux, Android)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - name: Build DMG (Apple Silicon)
        run: npx electron-builder --mac dmg --arm64 --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - run: codesign --force --deep --sign - "dist/mac-arm64/Toplix Pro.app" || true
      - name: Build DMG (Intel)
        run: npx electron-builder --mac dmg --x64 --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - run: codesign --force --deep --sign - "dist/mac-x64/Toplix Pro.app" || true
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: dist/*.dmg, if-no-files-found: error }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - run: npx electron-builder --win nsis --x64 --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/*.exe, if-no-files-found: error }

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - run: npx electron-builder --linux AppImage deb --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3

      - name: Install Capacitor
        working-directory: mobile
        run: npm install

      - name: Copy web app into the Android shell
        run: |
          rm -rf mobile/www && mkdir -p mobile/www
          cp -r renderer/. mobile/www/

      - name: Create Android project
        working-directory: mobile
        run: |
          npx cap add android
          npx capacitor-assets generate --android --assetBaseDir assets || echo "icon generation skipped"

      - name: Configure Android project (version, toplex:// deep link)
        working-directory: mobile
        run: |
          VERSION=$(node -p "require('../package.json').version")
          CODE=$(node -e "const [a,b,c]=require('../package.json').version.split('.').map(Number);console.log(a*10000+b*100+c)")
          sed -i "s/versionCode 1/versionCode $CODE/; s/versionName \"1.0\"/versionName \"$VERSION\"/" android/app/build.gradle
          python3 ../.github/add-deeplink.py android/app/src/main/AndroidManifest.xml

      - name: Sync web assets
        working-directory: mobile
        run: npx cap sync android

      - name: Build APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p out
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "out/Toplix-Pro-${VERSION}-android.apk"

      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/*.apk, if-no-files-found: error }

  release:
    needs: [macos, windows, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          sed "s/__VERSION__/${VERSION}/g" .github/release-notes.md > notes.md
          ls -la artifacts
          gh release create "$TAG" artifacts/* --title "Toplix Pro ${VERSION}" --notes-file notes.md \
            || { gh release upload "$TAG" artifacts/* --clobber && gh release edit "$TAG" --title "Toplix Pro ${VERSION}" --notes-file notes.md; }
