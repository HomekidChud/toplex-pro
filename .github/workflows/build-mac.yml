name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build DMG (Apple Silicon)
        run: npx electron-builder --mac dmg --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build DMG (Intel)
        run: npx electron-builder --mac dmg --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Determine version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          TAG="v${VERSION}"
          gh release create "$TAG" dist/*.dmg \
            --title "Toplix Pro ${VERSION}" \
            --notes "Toplix Pro ${VERSION} for macOS.

          ## Install
          1. Download Toplix-Pro-${VERSION}-arm64.dmg (Apple Silicon) or Toplix-Pro-${VERSION}-x64.dmg (Intel).
          2. Open the DMG and drag Toplix Pro to Applications.
          3. The app is unsigned: on first launch right-click the app and choose Open, then confirm. See INSTALL.md for details." \
            || gh release upload "$TAG" dist/*.dmg --clobber
